name: Android APK

# Zostaví testovacie (debug) APK. Stiahneš ho v záložke Actions →
# posledný beh „Android APK“ → Artifacts → banik-jozino-debug-apk.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # názvy obrázkov majú diakritiku (šach.png, ruža.png…)
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - name: Gradle assembleDebug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: banik-jozino-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
