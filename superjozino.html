<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SuperJozino</title>
    <link rel="stylesheet" href="css/superjozino.css">
    <link rel="stylesheet" type="text/css" href="css/fonts.css" />
    <link rel="icon" type="image/png" href="images/icons/favicon.png">
    <!-- Spoločné služby (reč, zvuk, profily, karty) – window.BJ -->
    <script type="module" src="src/bridge.js"></script>
    <!-- Herné plátno 1920×1080 – škálovanie na každú obrazovku -->
    <link rel="stylesheet" type="text/css" href="css/stage.css" />
    <link rel="stylesheet" type="text/css" href="css/common.css" />
    <link rel="stylesheet" type="text/css" href="css/cards.css" />
    <link rel="stylesheet" type="text/css" href="css/settings.css" />
    <link rel="stylesheet" type="text/css" href="css/sj-theme.css" />
    <!-- Písma vopred (bez preblikávania) -->
    <link rel="preload" href="fonts/luckiest-guy-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/luckiest-guy-latin-ext.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/nunito-latin-ext.woff2" as="font" type="font/woff2" crossorigin>
    <script src="js/stage.js"></script>
</head>
<body>
  <div id="bj-stage">
    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="800"></canvas>

        <!-- Horná lišta: späť, skóre v rámčekoch, nastavenia -->
        <div class="sj-topbar">
            <div class="back-button"><a href="urovne.html" aria-label="Späť"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5 7.5 12l7 7" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a></div>
            <div class="sj-hud">
                <div class="sj-hud__item"><img src="images/gold.png" alt=""><span id="hudCoins">0/0</span></div>
                <div class="sj-hud__item"><img src="images/diamond.png" alt=""><span id="hudDiamonds">0/0</span></div>
                <div class="sj-hud__item sj-hud__item--lives"><span id="hudLives">❤❤❤</span></div>
            </div>
            <button class="sj-gear" type="button" aria-label="Nastavenia" onclick="window.BJ && window.BJ.openSettings()"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" stroke="#000" stroke-width="0.8" d="M10.3 2h3.4l.5 2.6c.6.2 1.2.5 1.7.9l2.5-.9 1.7 2.9-2 1.8c.1.6.1 1.2 0 1.8l2 1.8-1.7 2.9-2.5-.9c-.5.4-1.1.7-1.7.9l-.5 2.6h-3.4l-.5-2.6c-.6-.2-1.2-.5-1.7-.9l-2.5.9-1.7-2.9 2-1.8a5 5 0 0 1 0-1.8l-2-1.8 1.7-2.9 2.5.9c.5-.4 1.1-.7 1.7-.9zM12 8.6a3.4 3.4 0 1 0 0 6.8 3.4 3.4 0 0 0 0-6.8z" transform="translate(0 1)"/></svg></button>
        </div>

        <!-- ladiaci panel (skrytý; zobrazí sa s ?debug v adrese) -->
        <div id="debugPanel" class="debug-panel">
            <button id="toggleDebug">Debug Mode: OFF</button>
            <div id="debugInfo"></div>
        </div>

        <!-- VIRTUAL JOYSTICK PRE MOBILY -->
        <!-- Akčné tlačidlo (JUMP) - vľavo -->
        <div class="action-controls">
            <button class="action-button" id="jumpButton" aria-label="Skok">
                ↑
            </button>
        </div>

        <!-- Virtual Joystick - vpravo -->
        <div class="joystick-controls">
            <div class="virtual-joystick" id="virtualJoystick">
                <div class="joystick-base"></div>
                <div class="joystick-knob" id="joystickKnob"></div>
            </div>
        </div>

    </div>

    <!-- POSLUCHOVÉ CVIČENIE MODAL - pred closing </body> tag -->
    <div id="zvuky" style="display: none;">
        <div class="info-dialog listening-exercise-dialog">
            <div class="dialog-header">
                <h2>Posluchové cvičenie</h2>
                <div class="progress-indicator">
                    <span id="listening-progress">1/2</span>
                </div>
            </div>
            
            <div class="dialog-content">
                <div class="listening-info">
                    <p class="instruction-text">Počúvaj pozorne oba zvuky a rozhodní, či sú <strong>rovnaké</strong> alebo <strong>rôzne</strong>.</p>
                </div>
                
                <div class="attempts-display">
                    Pokus: <span id="listening-attempts">1/3</span>
                </div>
                
                <div class="sound-buttons-container">
                    <button class="sound-play-btn" id="playSound1">
                        <span class="sound-icon" aria-hidden="true">🔊</span>
                        <span>Zvuk 1</span>
                    </button>
                    <button class="sound-play-btn" id="playSound2">
                        <span class="sound-icon" aria-hidden="true">🔊</span>
                        <span>Zvuk 2</span>
                    </button>
                </div>
                
                <div class="listening-buttons-container">
                    <button class="listening-btn listening-btn-same" id="sameButton">
                        <span class="answer-icon" aria-hidden="true">✔</span>
                        <span>Rovnaké</span>
                    </button>
                    <button class="listening-btn listening-btn-different" id="differentButton">
                        <span class="answer-icon" aria-hidden="true">✖</span>
                        <span>Rôzne</span>
                    </button>
                </div>
                
                <div class="listening-result" id="listeningResult">
                    <div class="result-container"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="blur-background" style="display: none;"></div>

  </div><!-- /bj-stage -->

    <script src="js/superjozino/joystick.js"></script>
    <script src="js/superjozino/game.js"></script>
    <script src="js/superjozino/levels.js"></script>
</body>
</html>
